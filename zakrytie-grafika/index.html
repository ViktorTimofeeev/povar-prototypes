<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<!-- «На экран Домой» в Safari: откроется без адресной строки браузера -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="График работы">
<meta name="mobile-web-app-capable" content="yes">
<title>Закрытие графика</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Manrope:wght@500;600;700&display=swap">

<style>
/* =====================================================================
   Токены UI-кита «Мой Повар» — значения из Фигмы, менять нельзя
   ===================================================================== */
:root{
  --text-and-icon:#1c201d;
  --text-and-icon-mute:#a1a6a1;
  --text-and-icon-on-dark:#ffffff;
  --bg:#ffffff;
  --bg-contrast:#f4f4f4;
  --accent:#1daa47;
  --accent-bg:#e7f5eb;
  --border:#e3e6e2;
  --error:#ff5748;

  --primitive-4:4px;
  --border-radius-small:8px;
  --border-radius:12px;
  --border-radius-big:16px;

  --font:"Golos Text",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;

  --h2:600 22px/28px var(--font);
  --h3:600 18px/22px var(--font);
  --h4:600 15px/21px var(--font);
  --h5:600 12px/15px var(--font);
  --body-v2:400 15px/21px var(--font);
  --caption-v2:400 12px/15px var(--font);

  --app-max:430px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg-contrast)}
body{
  margin:0;background:var(--bg-contrast);color:var(--text-and-icon);
  font:var(--body-v2);letter-spacing:0;-webkit-font-smoothing:antialiased;
}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;padding:0;margin:0;cursor:pointer;text-align:left}
p{margin:0}
svg{display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#app{max-width:var(--app-max);margin:0 auto;min-height:100dvh;background:var(--bg-contrast);position:relative}

.scr{min-height:100dvh;display:flex;flex-direction:column}
.scr-white{background:var(--bg)}

/* ---------- навбар ---------- */
.navbar{
  background:var(--bg);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 16px;position:sticky;top:0;z-index:10;
}
.navbar .ttl{font:var(--h4);flex:1;text-align:center}
.nav-btn{width:40px;height:40px;border-radius:180px;flex:none;display:flex;align-items:center;justify-content:center}
.nav-btn.grey{background:var(--bg-contrast)}
.nav-btn.ghost{visibility:hidden}
.nav-btn:active{filter:brightness(.95)}

/* =====================================================================
   КАЛЕНДАРЬ. Один месяц, переключение стрелками, таббара нет.
   Макет: «Профиль и обвес», секция «График работы · 03.09.26».
   ===================================================================== */
.month{padding:24px 16px 16px;display:flex;flex-direction:column}

.mnav{display:flex;align-items:center;justify-content:center;gap:16px}
.mnav .nm{font:var(--h2);white-space:nowrap;min-width:132px;text-align:center}
.mnav button{width:24px;height:24px;flex:none}

.mcount{
  padding-top:20px;text-align:right;
  font:var(--caption-v2);color:var(--text-and-icon-mute);
}

.wdays{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:24px}
.wdays button{
  background:var(--bg-contrast);border-radius:var(--primitive-4);
  padding:6px 8px 8px;font:var(--caption-v2);color:var(--text-and-icon);
  height:29px;
}

.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:12px}

.cell{
  height:58px;position:relative;
  display:flex;flex-direction:column;align-items:flex-start;gap:4px;
  padding:6px 8px 8px;
  background:var(--bg-contrast);border:1px solid var(--bg-contrast);
  border-radius:var(--primitive-4);
}
.cell .d{font:var(--caption-v2);font-variant-numeric:lining-nums tabular-nums;color:var(--text-and-icon)}
.cell .t{
  display:flex;flex-direction:column;gap:1px;
  font:400 9px/11px var(--font);font-variant-numeric:lining-nums tabular-nums;
  color:var(--text-and-icon);
}
/* выходной — та же плитка, но белая и без времени */
.cell.free{background:var(--bg)}
.cell.free .t{visibility:hidden}
/* выделенный день */
.cell.sel{background:var(--accent);border-color:var(--accent)}
.cell.sel .d,.cell.sel .t{color:var(--text-and-icon-on-dark)}
/* сегодня — плашка под числом */
.cell .d.today{
  background:var(--error);color:var(--text-and-icon-on-dark);
  border-radius:var(--primitive-4);min-width:11px;height:16px;
  display:inline-flex;align-items:center;justify-content:center;
  padding:0 3px;margin:-.5px -3px;
}
.cell.sel .d.today{background:var(--bg);color:var(--accent)}
/* соседние месяцы */
.cell.out{background:transparent;border-color:transparent;cursor:default}
.cell.out .d{color:var(--text-and-icon-mute);opacity:.5}
.cell.out .t{visibility:hidden}
/* чёрточка в стопке времени — признак перерыва внутри смены */
.cell .t{position:relative}
.cell .t .dash{
  position:absolute;left:-2px;top:12px;width:8px;height:1px;
  background:var(--text-and-icon-mute);
}
.cell.sel .t .dash{background:var(--text-and-icon-on-dark)}

/* ---------- плашка выделения ---------- */
.actionbar{
  background:var(--bg);border-top:1px solid var(--border);
  padding:16px 16px 56px;display:flex;flex-direction:column;gap:16px;
  position:sticky;bottom:0;margin-top:auto;z-index:5;
}
.ab-top{display:flex;gap:8px;align-items:flex-start}
.ab-txt{flex:1;min-width:0;font:var(--body-v2);padding:1px 0 2px}
.ab-txt i{font-style:normal;color:var(--text-and-icon-mute)}
.ab-x{width:24px;height:24px;flex:none}
.ab-btns{display:flex;gap:8px;align-items:flex-start}
.ab-col{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
/* сколько выходных подряд получится — под кнопкой «Выходной» */
.ab-hint{font:var(--caption-v2);color:var(--text-and-icon);text-align:center}

.btn{
  border-radius:var(--border-radius);
  display:flex;align-items:center;justify-content:center;gap:6px;
  padding:12px 20px;font:var(--body-v2);
}
.btn .lbl{padding:1px 0 2px}
.btn.primary{background:var(--accent);color:var(--text-and-icon-on-dark);padding-left:16px}
.btn.grey{background:var(--bg-contrast);color:var(--text-and-icon)}
.btn.flex{flex:1;min-width:0}
.btn:active{filter:brightness(.95)}
.btn:disabled{cursor:not-allowed}
.btn.grey:disabled{background:transparent;border:1px solid var(--border);color:var(--text-and-icon-mute);padding:11px 19px}
.btn.primary:disabled{background:var(--bg-contrast);color:var(--text-and-icon-mute)}
.btn.wide{width:100%;padding-left:20px}
.btn.wide .lbl{flex:1;min-width:0;text-align:center}

/* =====================================================================
   ШТОРКА «Рабочее время»
   ===================================================================== */
.scrim{position:fixed;inset:0;background:var(--text-and-icon);opacity:.5;z-index:20;animation:fade .18s ease}
@keyframes fade{from{opacity:0}}
.sheet-wrap{
  position:fixed;top:40px;bottom:0;left:0;right:0;z-index:21;
  max-width:var(--app-max);margin:0 auto;
  display:flex;flex-direction:column;align-items:center;gap:12px;
  animation:rise .24s cubic-bezier(.22,.7,.3,1);pointer-events:none;
}
@keyframes rise{from{transform:translateY(28px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.sheet-wrap,.scrim{animation:none}}
.sheet-wrap.hug{top:auto;bottom:0;max-height:calc(100dvh - 40px)}
.sheet-wrap.hug .sheet{flex:0 1 auto}
.grabber{width:60px;height:6px;border-radius:7px;background:var(--bg);flex:none}
.sheet{
  background:var(--bg);border-radius:var(--border-radius-big) var(--border-radius-big) 0 0;
  width:100%;flex:1;min-height:0;display:flex;flex-direction:column;
  padding-bottom:56px;overflow:hidden;pointer-events:auto;
}
.sheet-hd{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:16px;border-bottom:1px solid var(--border);flex:none;
}
.sheet-hd .ttl{flex:1;min-width:0;font:var(--h3)}
.sheet-hd .x{width:28px;height:28px;flex:none}
.sheet-body{padding:24px 16px;overflow-y:auto;flex:1;min-height:0;display:flex;flex-direction:column}

.fgroup{display:flex;flex-direction:column;gap:24px}
.fblock{display:flex;flex-direction:column;gap:8px}
.flabel{font:var(--body-v2);height:21px}
.trow{display:flex;gap:8px;align-items:center}
.trow .dash{font:var(--body-v2);flex:none}
.trow .tail{flex:1;min-width:0;display:flex;gap:8px;align-items:center}
.trow .del{width:24px;height:24px;flex:none}

.input{
  background:var(--bg);border:1px solid var(--border);border-radius:var(--border-radius);
  display:flex;align-items:center;justify-content:space-between;
  padding:12px;overflow:hidden;height:48px;position:relative;
}
.input.flex{flex:1;min-width:0}
.input .txt{font:var(--body-v2);font-variant-numeric:lining-nums tabular-nums;white-space:nowrap}
.input .ic{width:24px;height:24px;flex:none}
.input.bad{border-color:var(--error)}
.input select{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:none;padding:0;margin:0;font-size:16px;cursor:pointer}

.addbrk{display:flex;gap:4px;align-items:center;align-self:flex-start}
.addbrk .lbl{font:var(--h4);color:var(--accent);padding:1px 0 2px}

.submit{padding-top:48px;display:flex;flex-direction:column;gap:8px}
.submit .formerr{font:var(--caption-v2);color:var(--error)}

/* подсказки под кнопкой */
.tips{padding-top:8px;display:flex;flex-direction:column;gap:8px}
.tip{
  background:var(--bg-contrast);border-radius:var(--border-radius-small);
  padding:8px 8px 12px;display:flex;flex-direction:column;gap:4px;
  font:var(--caption-v2);color:var(--text-and-icon);
}
.tip b{font:var(--h5)}
.tips-row{display:flex;gap:8px;align-items:stretch}
.tips-row .tip{flex:1;min-width:0}

/* =====================================================================
   ШТОРКА «Приостановить работу» — секция 7540:15009
   ===================================================================== */
.pause-body{padding:24px 16px;overflow-y:auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:16px}
.pause-periods{font:var(--body-v2)}
.reason{display:flex;flex-direction:column;gap:8px}
.reason .flabel{color:var(--text-and-icon-mute)}
.reason textarea{
  display:block;width:100%;height:111px;resize:none;
  background:var(--bg);border:1px solid var(--border);border-radius:var(--border-radius-small);
  padding:8px 12px;font:var(--body-v2);color:var(--text-and-icon);
}
.reason textarea:focus{outline:none;border-color:var(--accent)}
.chk{display:flex;gap:6px;align-items:center;align-self:flex-start;padding-bottom:8px}
.chk .box{
  width:24px;height:24px;flex:none;display:flex;align-items:center;justify-content:center;
}
.chk .box i{
  width:18px;height:18px;border-radius:var(--primitive-4);border:1px solid var(--border);
  background:var(--bg);display:flex;align-items:center;justify-content:center;
}
.chk.on .box i{background:var(--accent);border-color:var(--accent)}
.chk.on .box svg path{stroke:var(--text-and-icon-on-dark)}
.chk .lbl{font:var(--body-v2);padding:1px 0 2px}
.pause-foot{padding:16px 16px 0;flex:none}

/* ---------- нижнее меню (осталось только в профиле) ---------- */
.tabbar{
  background:var(--bg);border-top:1px solid var(--border);
  display:flex;align-items:flex-start;justify-content:center;padding:0 8px;
  position:sticky;bottom:0;margin-top:auto;
}
.tabitem{
  flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  gap:2px;padding:12px 0 24px;position:relative;
}
.tabitem .lbl{font:var(--caption-v2);color:var(--text-and-icon-mute);padding-bottom:1px}
.tabitem.on .lbl{color:var(--accent)}
.tabitem .ic{position:relative}
.tabitem .badge{
  position:absolute;left:12px;top:-8px;
  background:var(--error);border:2px solid var(--bg);border-radius:16px;
  padding:0 4px 2px;min-width:16px;text-align:center;
  font:var(--caption-v2);color:var(--text-and-icon-on-dark);
}

/* =====================================================================
   ШТОРКА «Подсказки»
   ===================================================================== */
.tips-body{padding:24px 16px;overflow-y:auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:16px}
.tip-row{
  display:flex;gap:16px;align-items:flex-start;
  padding:8px 0;border-bottom:1px solid var(--border);
}
.tip-row p{flex:1;min-width:0;font:var(--body-v2)}
.tip-ill{flex:none;display:flex;gap:2px;align-items:center}
.tip-ill .cell{width:47.29px}

/* увеличенный кусок ячейки — показать чёрточку крупно */
.tip-mag{width:68px;height:58px;position:relative;overflow:hidden;flex:none}
.tip-mag .cell{position:absolute;left:-.286px;top:-53.447px;transform:scale(2.184);transform-origin:0 0}

/* столбец «нажал на день недели» с затуханием и кружком нажатия */
.tip-week{width:48px;height:66px;position:relative;overflow:hidden;flex:none}
.tip-week .col{position:absolute;left:0;top:0;width:48px;display:flex;flex-direction:column;gap:4px}
.tip-week .wd{
  background:var(--bg-contrast);border-radius:var(--primitive-4);
  padding:6px 8px 8px;font:var(--caption-v2);color:var(--text-and-icon);
}
.tip-week .cell{width:48px}
.tip-week .fade{
  position:absolute;left:0;right:0;bottom:0;height:25px;
  background:linear-gradient(to top,var(--bg),rgba(255,255,255,0));
}
.tip-week .hand{position:absolute;left:18.33px;top:15px;width:16px;height:17px}
/* =====================================================================
   ПРОФИЛЬ. Карточки этого экрана набраны Manrope — так в ките;
   заголовок «Шеф на выезд» — Golos Text body-lg 16/24 c трекингом −0.32.
   ===================================================================== */
.scr-profile{background:var(--bg-contrast)}

/* шапка с адресом: 8px сверху, строка 40, снизу линия #efefef */
.pnav{
  background:var(--bg);border-bottom:1px solid #efefef;
  padding:8px 16px 0;height:48px;position:sticky;top:0;z-index:10;
}
.pnav-row{height:40px;display:flex;align-items:center;justify-content:center}
.pnav-form{display:flex;gap:8px;align-items:center;border-radius:var(--border-radius-small)}
.pnav-loc{display:flex;gap:10px;align-items:center;justify-content:center}
.pnav-loc .ic{width:16px;height:16px;flex:none}
.pnav-loc .tx{
  font:600 14px/20px "Manrope",var(--font);color:var(--text-and-icon);
  white-space:nowrap;font-feature-settings:"salt" 1,"liga" 0;
}
.pnav-form .cv{width:24px;height:24px;flex:none}

.pbody{padding:24px 16px 12px;display:flex;flex-direction:column;gap:12px;flex:1}

.pcard{background:var(--bg);border-radius:var(--border-radius);box-shadow:0 2px 5px rgba(0,0,0,.05)}
.pcard.pmenu{padding:12px 16px;display:flex;flex-direction:column;gap:12px}
/* в Фигме это line нулевой высоты со штрихом поверх — гасим 1px отрицательными полями */
.pline{height:1px;margin:-.5px 0;background:var(--border);width:100%;flex:none}

.prow{display:flex;gap:10px;align-items:center;width:100%;text-align:left}
.prow.top{align-items:flex-start}
.prow-l{flex:1;min-width:0;display:flex;gap:10px;align-items:center}
.prow.top .prow-l{align-items:flex-start}
.pico{width:20px;height:20px;flex:none;position:relative}
.pico.pt{margin-top:2px}
.pico.rot180{transform:rotate(180deg)}
/* иконки, вложенные в бокс 20×20 со смещениями из Фигмы */
.pico.inset-chat svg{position:absolute;left:12.5%;top:16.67%;width:75%;height:66.66%}
.pico.inset-card svg{position:absolute;left:9.38%;top:18.75%;width:81.24%;height:59.37%}
.pico.inset-time svg{position:absolute;left:10%;top:10%;width:80%;height:80%}
.plbl{flex:1;min-width:0;font:500 16px/24px "Manrope",var(--font);color:var(--text-and-icon)}
.plbl.nowrap{flex:none;white-space:nowrap}
.pchev{width:24px;height:24px;flex:none;transform:rotate(90deg)}

.pbadge{
  background:var(--error);height:22px;border-radius:var(--border-radius-small);
  padding:2px 4px 3px;display:flex;align-items:center;justify-content:center;flex:none;
}
.pbadge span{
  font:600 12px/18px "Manrope",var(--font);color:var(--bg-contrast);
  width:20px;text-align:center;
}

.pnew{display:flex;gap:8px;align-items:center;flex:none}
.ptag{
  border:1px solid var(--accent);border-radius:var(--border-radius-small);
  padding:3px 7px 4px;font:var(--caption-v2);color:var(--accent);flex:none;
}

/* карточка профиля */
.pcard.phead{padding:16px}
.phead-row{display:flex;gap:12px;align-items:center}
.pava{width:46px;height:46px;border-radius:50%;object-fit:cover;flex:none;display:block}
.pname-col{display:flex;flex-direction:column;gap:6px;justify-content:center;min-width:0}
.pname{font:700 16px/20px "Manrope",var(--font);color:var(--text-and-icon);white-space:nowrap}
.pset{display:flex;gap:2px;align-items:center}
.pset .tx{font:600 14px/20px "Manrope",var(--font);color:var(--accent);white-space:nowrap}
.pset .ic{width:20px;height:20px;flex:none}

/* «Шеф на выезд» — с картинкой в углу */
.pcard.pchef{
  padding:12px 16px;position:relative;overflow:hidden;
  box-shadow:0 2px 10px rgba(0,0,0,.05);
}
.pchef .deco{
  position:absolute;right:0;top:0;width:149px;height:64px;
  object-fit:cover;object-position:center 46%;pointer-events:none;
}
.pchef .prow{position:relative}
.pchef-txt{flex:1;min-width:0;display:flex;flex-direction:column}
.pchef-txt .t{font:400 16px/24px var(--font);letter-spacing:-.32px;color:var(--text-and-icon)}
.pchef-txt .s{font:var(--caption-v2);color:var(--text-and-icon-mute)}

</style>
</head>

<div id="app"></div>

<script>
"use strict";

/* =====================================================================
   ИКОНКИ — экспорт из Фигмы, путь в путь
   ===================================================================== */
const I = {

"addwhite": "<svg overflow=\"visible\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\"> <g id=\"add+\"> <path id=\"add_2\" d=\"M11.25 20.5V12.75H3.5V11.25H11.25V3.5H12.75V11.25H20.5V12.75H12.75V20.5H11.25Z\" fill=\"white\"/> </g> </svg>",
"chevleft": "<svg overflow=\"visible\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\"> <g id=\"chevron-left-bold\"> <path id=\"Vector 201\" d=\"M14.5 17.5L9.5 12.5L14.5 7.5\" stroke=\"#1DAA47\" stroke-width=\"2\"/> </g> </svg>",

/* =====================================================================
   КОНСТАНТЫ
   ===================================================================== */
const MONTH_NOM = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONTH_PRE = ['январе','феврале','марте','апреле','мае','июне','июле','августе','сентябре','октябре','ноябре','декабре'];
const WD_SHORT  = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const TIMES     = (()=>{const a=[];for(let h=0;h<24;h++)for(const m of [0,30])a.push(String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'));return a;})();

const TODAY  = {y:2026, m:7, d:2};   // 2 августа 2026 — «сегодня» прототипа

/* график новичка: каждый день каждого месяца с 8 до 23 */
const DEFAULT_DAY = {s:'08:00', e:'23:00', brs:[]};

/* выходные на старте — как в макетах секции 7540:15009,
   чтобы повторить их сценарии: 17, 19–21, 23 августа и 1–4 сентября */
const SEED_OFF = ['2026-08-17','2026-08-19','2026-08-20','2026-08-21','2026-08-23',
                  '2026-09-01','2026-09-02','2026-09-03','2026-09-04'];

/* с какой длины серии выходных подряд просим указать причину и предупреждаем менеджера */
const PAUSE_MIN = 7;
const MONTH_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];

const pad   = n => String(n).padStart(2,'0');
const key   = (y,m,d) => `${y}-${pad(m+1)}-${pad(d)}`;
const dim   = (y,m) => new Date(y, m+1, 0).getDate();
const wd    = (y,m,d) => (new Date(y,m,d).getDay()+6)%7;
const t2m   = t => { const [h,mm]=t.split(':').map(Number); return h*60+mm; };
const cloneDay = v => v ? {s:v.s, e:v.e, brs:v.brs.map(b=>({...b}))} : null;

function plural(n, one, few, many){
  const a = n % 10, b = n % 100;
  if(a === 1 && b !== 11) return one;
  if(a >= 2 && a <= 4 && (b < 12 || b > 14)) return few;
  return many;
}
const daysWord = n => `${n} ${plural(n,'день','дня','дней')}`;

/* =====================================================================
   СОСТОЯНИЕ
   ===================================================================== */
let S;

function freshState(){
  return {
    screen:'profile', sheet:null,
    sel:new Set(),          // 'YYYY-MM-DD' — выделение сквозное по всем месяцам
    days:new Map(),         // 'YYYY-MM-DD' -> {s,e,brs:[]}
    touched:new Set(SEED_OFF),  // дни, заданные руками — дефолт их не трогает
    materialized:new Set(),
    draft:null,
    view:{y:TODAY.y, m:TODAY.m},  // какой месяц на экране
    reason:'', noReturn:false,    // черновик шторки паузы
  };
}

function materialize(y, m){
  const mk = `${y}-${pad(m+1)}`;
  if(S.materialized.has(mk)) return;
  const n = dim(y,m);
  for(let d=1; d<=n; d++){
    const k = key(y,m,d);
    if(S.touched.has(k) || S.days.has(k)) continue;
    S.days.set(k, cloneDay(DEFAULT_DAY));
  }
  S.materialized.add(mk);
}

const workCount = (y,m) => {
  materialize(y,m);
  let n = 0;
  for(let d=1; d<=dim(y,m); d++) if(S.days.has(key(y,m,d))) n++;
  return n;
};

/* =====================================================================
   ВЫДЕЛЕНИЕ — сквозное, может захватывать несколько месяцев
   ===================================================================== */
const selList = () => [...S.sel].sort();
function toggleDay(k){ if(S.sel.has(k)) S.sel.delete(k); else S.sel.add(k); }

const sig = v => v ? `${v.s}-${v.e}-${v.brs.map(b=>b.s+'/'+b.e).join(',')}` : 'OFF';

function selValue(){
  const a = selList();
  if(!a.length) return null;
  const vals = a.map(k => S.days.get(k) || null);
  const first = sig(vals[0]);
  return {vals, same:vals.every(v=>sig(v)===first), allOff:vals.every(v=>v===null), sample:vals[0]};
}

/* =====================================================================
   ПАУЗА — серии выходных подряд, которые получатся после «Выходного».
   Считаем по результату: выделенные дни вместе с соседними выходными,
   через границу месяца и с прошедшими днями.
   ===================================================================== */
const k2d = k => new Date(+k.slice(0,4), +k.slice(5,7)-1, +k.slice(8,10));
const d2k = d => key(d.getFullYear(), d.getMonth(), d.getDate());
const shift = (k, n) => { const d = k2d(k); d.setDate(d.getDate()+n); return d2k(d); };

function isOffNow(k){
  const d = k2d(k);
  materialize(d.getFullYear(), d.getMonth());
  return !S.days.has(k);
}

/* серии от PAUSE_MIN дней, в которые попал хоть один выделенный день */
function pauseRuns(){
  const off = k => S.sel.has(k) || isOffNow(k);
  const runs = [];
  selList().forEach(k => {
    if(runs.some(r => k >= r.from && k <= r.to)) return;
    let from = k, to = k;
    while(off(shift(from,-1))) from = shift(from,-1);
    while(off(shift(to,1)))    to   = shift(to,1);
    const n = Math.round((k2d(to) - k2d(from)) / 86400000) + 1;
    runs.push({from, to, n});
  });
  return runs.filter(r => r.n >= PAUSE_MIN);
}

/* «с 3 до 9 августа», «с 29 августа до 4 сентября» */
function rangePhrase(from, to){
  const a = k2d(from), b = k2d(to);
  const same = a.getMonth() === b.getMonth() && a.getFullYear() === b.getFullYear();
  return `с ${a.getDate()}${same ? '' : ' '+MONTH_GEN[a.getMonth()]} до ${b.getDate()} ${MONTH_GEN[b.getMonth()]}`;
}
const datePhrase = k => { const d = k2d(k); return `${d.getDate()} ${MONTH_GEN[d.getMonth()]}`; };

function applyOff(){
  selList().forEach(k => { S.days.delete(k); S.touched.add(k); });
  S.sel.clear();
}

function timePhrase(v){
  if(!v.brs.length) return `${v.s}—${v.e}`;
  const word = plural(v.brs.length, 'перерыв', 'перерыва', 'перерывов');
  return `${v.s}—${v.e}, ${word} ${v.brs.map(b=>`${b.s}—${b.e}`).join(', ')}`;
}

/* =====================================================================
   ВАЛИДАЦИЯ
   ===================================================================== */
function problems(d){
  const out = [];
  if(t2m(d.e) <= t2m(d.s)) out.push('Конец рабочего дня раньше начала — поменяйте время');
  d.brs.forEach((b,i) => {
    if(t2m(b.e) <= t2m(b.s)) out.push(`Конец перерыва раньше начала — поменяйте время`);
    else if(t2m(b.s) < t2m(d.s) || t2m(b.e) > t2m(d.e))
      out.push('Перерыв должен укладываться в рабочие часы');
  });
  const sorted = d.brs.map((b,i)=>({i, s:t2m(b.s), e:t2m(b.e)})).sort((a,z)=>a.s-z.s);
  for(let i=1;i<sorted.length;i++)
    if(sorted[i].s < sorted[i-1].e){ out.push('Перерывы пересекаются'); break; }
  return [...new Set(out)];
}
const brBad = (d,b) => t2m(b.e) <= t2m(b.s) || t2m(b.s) < t2m(d.s) || t2m(b.e) > t2m(d.e);

/* =====================================================================
   РЕНДЕР
   ===================================================================== */
const app = document.getElementById('app');

function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html!=null) e.innerHTML = html;
  return e;
}

function render(reset){
  const y = reset ? 0 : window.scrollY;
  const prev = app.querySelector('.sheet-body');
  const sy = (!reset && prev) ? prev.scrollTop : 0;

  app.innerHTML = '';
  app.appendChild(S.screen === 'profile' ? scrProfile() : scrCalendar());
  if(S.sheet === 'time') sheetTime();
  if(S.sheet === 'tips') sheetTips();
  if(S.sheet === 'pause') sheetPause();

  document.body.classList.toggle('locked', !!S.sheet);
  window.scrollTo(0, reset ? 0 : y);
  const ns = app.querySelector('.sheet-body');
  if(ns) ns.scrollTop = sy;
}

function navbar(title, opts){
  const n = el('div','navbar');
  const left = el('button','nav-btn '+(opts.back?'grey':'ghost'), opts.back ? I.back : '');
  if(opts.back) left.onclick = opts.back;
  const right = el('button','nav-btn '+(opts.help?'grey':'ghost'), opts.help ? I.help : '');
  if(opts.help) right.onclick = opts.help;
  n.append(left, el('div','ttl', title), right);
  return n;
}

function tabBar(profileBadge){
  const t = el('div','tabbar');
  [{ic:'tab_home',l:'Главная'},{ic:'tab_hat',l:'Каталог'},{ic:'tab_orders',l:'Заказы'},
   {ic:'tab_cart',l:'Корзина',badge:'4'},
   {ic:'tab_ava',l:'Профиль',on:true,badge:profileBadge?'23':null}].forEach(it => {
    const d = el('div','tabitem'+(it.on?' on':''));
    const icw = el('div','ic', I[it.ic]);
    if(it.badge) icw.appendChild(el('span','badge', it.badge));
    d.append(icw, el('div','lbl', it.l));
    t.appendChild(d);
  });

}

/* ---------- календарь: один месяц ---------- */
function scrCalendar(){
  const s = el('div','scr scr-white');
  s.appendChild(navbar('График работы', {
    back: () => { S.screen='profile'; S.sel.clear(); render(true); },
    help: () => { S.sheet='tips'; render(true); },
  }));

  s.appendChild(monthBlock(S.view.y, S.view.m));

  if(S.sel.size) s.appendChild(actionBar());
  return s;
}

function stepMonth(dir){
  const d = new Date(S.view.y, S.view.m + dir, 1);
  S.view = {y:d.getFullYear(), m:d.getMonth()};
  render();
}

function monthBlock(y, m){
  materialize(y,m);
  const total = dim(y,m), work = workCount(y,m);
  const b = el('div','month');

  const nav = el('div','mnav');
  const prev = el('button','', I.chevleft), next = el('button','', I.chevright);
  prev.setAttribute('aria-label','Предыдущий месяц');
  next.setAttribute('aria-label','Следующий месяц');
  prev.onclick = () => stepMonth(-1);
  next.onclick = () => stepMonth(1);
  nav.append(prev, el('div','nm', `${MONTH_NOM[m]} ${y}`), next);
  b.appendChild(nav);

  const wds = el('div','wdays');
  WD_SHORT.forEach((w,i) => {
    const btn = el('button','', w);
    btn.onclick = () => toggleColumn(y,m,i);
    wds.appendChild(btn);
  });
  b.appendChild(wds);

  const grid = el('div','mgrid');
  const lead = wd(y,m,1);
  const pmN = dim(m===0 ? y-1 : y, m===0 ? 11 : m-1);
  for(let i=lead-1;i>=0;i--) grid.appendChild(el('div','cell out', `<span class="d">${pmN-i}</span>`));
  for(let d=1; d<=total; d++) grid.appendChild(dayCell(y,m,d));
  const tail = (7 - ((lead+total)%7)) % 7;
  for(let d=1; d<=tail; d++) grid.appendChild(el('div','cell out', `<span class="d">${d}</span>`));
  b.appendChild(grid);

  b.appendChild(el('div','mcount', `Рабочих ${work} из ${total}`));
  return b;
}

function dayCell(y,m,d){
  const k = key(y,m,d);
  const v = S.days.get(k);
  const selected = S.sel.has(k);
  const today = y===TODAY.y && m===TODAY.m && d===TODAY.d;
  const c = el('button','cell'+(v?'':' free')+(selected?' sel':''));
  const a = v ? v.s : '08:00', b = v ? v.e : '23:00';
  const dash = (v && v.brs.length) ? '<i class="dash"></i>' : '';
  c.innerHTML = `<span class="d${today?' today':''}">${d}</span>` +
                `<span class="t">${dash}<span>${a}</span><span>${b}</span></span>`;
  c.onclick = () => { toggleDay(k); render(); };
  return c;
}

function toggleColumn(y,m,wi){
  const total = dim(y,m), col = [];
  for(let d=1; d<=total; d++) if(wd(y,m,d)===wi) col.push(key(y,m,d));
  const allIn = col.every(k => S.sel.has(k));
  col.forEach(k => allIn ? S.sel.delete(k) : S.sel.add(k));
  render();
}

/* ---------- плашка выделения ---------- */
function actionBar(){
  const bar = el('div','actionbar');
  const v = selValue();
  const tail = v.allOff ? 'выходной' : (v.same ? timePhrase(v.sample) : 'разное время');

  const top = el('div','ab-top');
  top.appendChild(el('div','ab-txt', `${daysWord(S.sel.size)}: <i>${tail}</i>`));
  const x = el('button','ab-x', I.close24);
  x.onclick = () => { S.sel.clear(); render(); };
  top.appendChild(x);
  bar.appendChild(top);

  const btns = el('div','ab-btns');
  const edit = el('button','btn primary flex', `${I.clock}<span class="lbl">Изменить</span>`);
  edit.onclick = () => {
    S.draft = (v.same && v.sample) ? cloneDay(v.sample) : cloneDay(DEFAULT_DAY);
    S.sheet = 'time'; render(true);
  };
  /* «Выходной» не переименовываем. Если получится PAUSE_MIN и больше
     выходных подряд — пишем под кнопкой самую длинную серию,
     а по нажатию открываем шторку паузы */
  const runs = v.allOff ? [] : pauseRuns();
  const col = el('div','ab-col');
  const off = el('button','btn grey', '<span class="lbl">Выходной</span>');
  off.disabled = v.allOff;
  off.onclick = () => {
    if(runs.length){ S.reason=''; S.noReturn=false; S.sheet='pause'; render(); return; }
    applyOff(); render();
  };
  col.appendChild(off);
  if(runs.length){
    const n = Math.max(...runs.map(r => r.n));
    col.appendChild(el('div','ab-hint', `${n} ${plural(n,'выходной','выходных','выходных')} подряд`));
  }
  btns.append(edit, col);
  bar.appendChild(btns);
  return bar;
}

/* ---------- шторка «Рабочее время» ---------- */
function timeInput(value, onChange, bad){
  const w = el('div','input flex'+(bad?' bad':''));
  w.innerHTML = `<span class="txt">${value}</span><span class="ic">${I.caret}</span>`;
  const sl = document.createElement('select');
  TIMES.forEach(t => { const o=document.createElement('option'); o.value=t; o.textContent=t; if(t===value)o.selected=true; sl.appendChild(o); });
  sl.onchange = () => onChange(sl.value);
  w.appendChild(sl);
  return w;
}

function sheetTime(){
  const d = S.draft;
  const close = () => { S.sheet=null; S.draft=null; render(true); };

  const scrim = el('div','scrim');
  scrim.onclick = close;
  const wrap = el('div','sheet-wrap');
  wrap.appendChild(el('div','grabber'));

  const sh = el('div','sheet');
  const hd = el('div','sheet-hd');
  hd.appendChild(el('div','ttl','Рабочее время'));
  const x = el('button','x', I.close28);
  x.onclick = close;
  hd.appendChild(x);
  sh.appendChild(hd);

  const body = el('div','sheet-body');
  const errs = problems(d);
  const g = el('div','fgroup');

  /* рабочие часы */
  const badWork = t2m(d.e) <= t2m(d.s);
  const wb = el('div','fblock');
  wb.appendChild(el('div','flabel','Рабочие часы'));
  const wrow = el('div','trow');
  wrow.appendChild(timeInput(d.s, v => { d.s = v; render(); }, badWork));
  wrow.appendChild(el('span','dash','—'));
  wrow.appendChild(timeInput(d.e, v => { d.e = v; render(); }, badWork));
  wb.appendChild(wrow);
  g.appendChild(wb);

  /* перерывы */
  if(d.brs.length){
    const bb = el('div','fblock');
    bb.appendChild(el('div','flabel','Перерыв'));
    d.brs.forEach((br, i) => {
      const bad = brBad(d, br);
      const row = el('div','trow');
      row.appendChild(timeInput(br.s, v => { br.s = v; render(); }, bad));
      row.appendChild(el('span','dash','—'));
      const tail = el('div','tail');
      tail.appendChild(timeInput(br.e, v => { br.e = v; render(); }, bad));
      const del = el('button','del', I.delete_accent);
      del.onclick = () => { d.brs.splice(i,1); render(); };
      tail.appendChild(del);
      row.appendChild(tail);
      bb.appendChild(row);
    });
    g.appendChild(bb);
  }

  const add = el('button','addbrk', `${I.addbold}<span class="lbl">Добавить перерыв</span>`);
  add.onclick = () => {
    const last = d.brs.length ? t2m(d.brs[d.brs.length-1].e) : t2m(d.s) + 300;
    const s0 = Math.min(last + 60, t2m(d.e) - 60);
    const mk = v => pad(Math.floor(v/60)%24)+':'+pad(v%60);
    d.brs.push({s: mk(Math.max(s0, t2m(d.s))), e: mk(Math.max(s0, t2m(d.s)) + 60)});
    render();
  };
  g.appendChild(add);
  body.appendChild(g);

  /* сохранить + подсказки */
  const sub = el('div','submit');
  const save = el('button','btn primary wide',
    `<span class="lbl">Сохранить на ${daysWord(S.sel.size)}</span>`);
  save.disabled = errs.length > 0;
  save.onclick = () => {
    selList().forEach(k => { S.days.set(k, cloneDay(d)); S.touched.add(k); });
    S.sel.clear(); S.sheet=null; S.draft=null; render(true);
  };
  sub.appendChild(save);
  errs.forEach(p => sub.appendChild(el('div','formerr', p)));

  const tips = el('div','tips');
  const tip = (t, b) => el('div','tip', `<b>${t}</b><span>${b}</span>`);
  tips.appendChild(tip('Учтите запас времени на приготовление',
    'Покупатель может оформить заказ заранее и выбрать доставку на начало рабочего дня. Например, если вы работаете с 08:00, первый доступный интервал доставки будет начинаться в 08:00. К этому времени нужно успеть купить продукты, приготовить блюдо и отправить заказ.'));
  tips.appendChild(tip('Какой запас лучше оставить',
    'Не делайте его слишком большим или слишком маленьким. Ориентируйтесь на среднее время, которое вам обычно нужно на закупку и приготовление заказа.'));
  const row = el('div','tips-row');
  row.appendChild(tip('Как видит покупатель',
    'До начала рабочего дня срок выполнения заказа считается с момента оформления, а не только с начала смены.'));
  row.appendChild(tip('Если не успеваете',
    'Вы всегда можете написать покупателю в чат и предложить перенести доставку на более позднее время.'));
  tips.appendChild(row);
  sub.appendChild(tips);

  body.appendChild(sub);
  sh.appendChild(body);
  wrap.appendChild(sh);
  app.append(scrim, wrap);
}


/* ---------- шторка «Приостановить работу» ---------- */
function sheetPause(){
  const runs = pauseRuns();
  /* закрыли — возвращаемся туда же: дни остаются выделенными */
  const close = () => { S.sheet=null; render(); };

  const scrim = el('div','scrim');
  scrim.onclick = close;
  const wrap = el('div','sheet-wrap');
  wrap.appendChild(el('div','grabber'));

  const sh = el('div','sheet');
  const hd = el('div','sheet-hd');
  hd.appendChild(el('div','ttl','Приостановить работу'));
  const x = el('button','x', I.close28);
  x.setAttribute('aria-label','Закрыть');
  x.onclick = close;
  hd.appendChild(x);
  sh.appendChild(hd);

  const body = el('div','pause-body');

  /* «На 7 дней, с 29 августа до 4 сентября, вернусь 5 сентября».
     Несколько периодов — каждый своей строкой, возвращение — после самого позднего */
  const last = runs.map(r => r.to).sort().pop();
  const parts = runs.map(r => `на ${daysWord(r.n)}, ${rangePhrase(r.from, r.to)}`);
  parts[0] = parts[0][0].toUpperCase() + parts[0].slice(1);
  body.appendChild(el('div','pause-periods',
    parts.join(',<br>') + (runs.length > 1 ? ',<br>' : ', ') + `вернусь ${datePhrase(shift(last,1))}`));

  const rs = el('div','reason');
  rs.appendChild(el('label','flabel','Укажите причину'));
  const ta = document.createElement('textarea');
  ta.id = 'pause-reason';
  rs.querySelector('label').htmlFor = ta.id;
  ta.value = S.reason;
  rs.appendChild(ta);
  body.appendChild(rs);

  const chk = el('button','chk'+(S.noReturn?' on':''),
    `<span class="box"><i>${S.noReturn ? I.check : ''}</i></span><span class="lbl">Не планирую возвращаться</span>`);
  chk.setAttribute('role','checkbox');
  chk.setAttribute('aria-checked', S.noReturn);
  chk.onclick = () => { S.noReturn = !S.noReturn; render(); };
  body.appendChild(chk);

  sh.appendChild(body);

  const foot = el('div','pause-foot');
  const save = el('button','btn primary wide','<span class="lbl">Сохранить</span>');
  const ready = () => S.reason.trim().length > 0;
  save.disabled = !ready();
  /* поле не перерисовываем на каждый символ, иначе слетит фокус */
  ta.oninput = () => { S.reason = ta.value; save.disabled = !ready(); };
  save.onclick = () => {
    if(!ready()) return;
    applyOff();
    S.sheet=null; S.reason=''; S.noReturn=false;
    render();
  };
  foot.appendChild(save);
  sh.appendChild(foot);

  wrap.appendChild(sh);
  app.append(scrim, wrap);
}

/* ---------- шторка «Подсказки» ---------- */
function tipCell(day, opts){
  const o = opts || {};
  const c = el('div','cell'+(o.sel?' sel':''));
  c.innerHTML = `<span class="d${o.today?' today':''}">${day}</span>` +
                `<span class="t">${o.dash?'<i class="dash"></i>':''}<span>08:00</span><span>23:00</span></span>`;
  return c;
}

function sheetTips(){
  const close = () => { S.sheet=null; render(true); };

  const scrim = el('div','scrim');
  scrim.onclick = close;
  const wrap = el('div','sheet-wrap hug');
  wrap.appendChild(el('div','grabber'));

  const sh = el('div','sheet');
  const hd = el('div','sheet-hd');
  hd.appendChild(el('div','ttl','Подсказки'));
  const x = el('button','x', I.close28);
  x.onclick = close;
  hd.appendChild(x);
  sh.appendChild(hd);

  const body = el('div','tips-body');

  const row = (text, ill) => {
    const r = el('div','tip-row');
    r.appendChild(el('p','', text));
    r.appendChild(ill);
    body.appendChild(r);
  };

  /* выбор нескольких дней */
  const ill1 = el('div','tip-ill');
  ill1.append(tipCell(1,{sel:true}), tipCell(2,{sel:true}), tipCell(3));
  row('Можно выбрать один или несколько дней, в любом месяце', ill1);

  /* текущий день */
  const ill2 = el('div','tip-ill');
  ill2.append(tipCell(1), tipCell(2,{today:true}), tipCell(3));
  row('Красным выделен текущий день', ill2);

  /* тап по дню недели */
  const ill3 = el('div','tip-week');
  const col = el('div','col');
  col.appendChild(el('div','wd','Сб'));
  col.appendChild(tipCell(1,{sel:true}));
  ill3.append(col, el('div','fade'), el('div','hand', I.hand));
  row('Нажав на день недели выбираются все дни недели в месяце', ill3);

  /* чёрточка = перерыв */
  const ill4 = el('div','tip-mag');
  ill4.appendChild(tipCell(1,{dash:true}));
  row('Черта в ячейке означает наличие перерыва', ill4);

  sh.appendChild(body);
  wrap.appendChild(sh);
  app.append(scrim, wrap);
}
/* ---------- профиль ---------- */
function pRow(o){
  const r = el(o.onclick ? 'button' : 'div', 'prow' + (o.top ? ' top' : ''));
  const l = el('div','prow-l');
  l.appendChild(el('span',
    'pico' + (o.inset ? ' inset-'+o.inset : '') + (o.top ? ' pt' : '') + (o.rot180 ? ' rot180' : ''),
    I[o.icon]));

  if(o.sub){
    l.appendChild(el('span','pchef-txt', `<span class="t">${o.label}</span><span class="s">${o.sub}</span>`));
  }else if(o.tag){
    const g = el('span','pnew');
    g.appendChild(el('span','plbl nowrap', o.label));
    g.appendChild(el('span','ptag', o.tag));
    l.appendChild(g);
  }else{
    l.appendChild(el('span','plbl' + (o.badge ? ' nowrap' : ''), o.label));
    if(o.badge) l.appendChild(el('span','pbadge', `<span>${o.badge}</span>`));
  }
  r.appendChild(l);
  if(!o.nochev) r.appendChild(el('span','pchev', I.prof_chev));
  if(o.onclick) r.onclick = o.onclick;
  return r;
}

function pCard(rows){
  const c = el('div','pcard pmenu');
  rows.forEach((row,i) => { if(i) c.appendChild(el('div','pline')); c.appendChild(pRow(row)); });
  return c;
}
